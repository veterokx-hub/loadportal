databaseChangeLog:
  - changeSet:
      id: 1-baseline-schema
      author: loadtest-portal
      comment: Initial schema (Liquibase). Используется constructor и Argo init-job.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: portal_users
      changes:
        - createTable:
            tableName: portal_users
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: username, type: varchar(128), constraints: { nullable: false, unique: true } }
              - column: { name: password_hash, type: varchar(255) }
              - column: { name: role, type: varchar(16), constraints: { nullable: false } }
              - column: { name: enabled, type: boolean, constraints: { nullable: false } }
              - column: { name: ldap_only, type: boolean, constraints: { nullable: false } }
              - column: { name: must_change_password, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }

        - createTable:
            tableName: auth_sessions
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: token, type: varchar(64), constraints: { nullable: false, unique: true } }
              - column: { name: username, type: varchar(128), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: expires_at, type: timestamptz, constraints: { nullable: false } }

        - createIndex:
            indexName: idx_auth_sessions_token
            tableName: auth_sessions
            unique: true
            columns:
              - column: { name: token }

        - createTable:
            tableName: portal_settings
            columns:
              - column: { name: id, type: bigint, constraints: { primaryKey: true, nullable: false } }
              - column: { name: ldap_enabled, type: boolean, constraints: { nullable: false } }
              - column: { name: ldap_url, type: varchar(512) }
              - column: { name: ldap_base_dn, type: varchar(512) }
              - column: { name: ldap_user_dn_pattern, type: varchar(512) }
              - column: { name: ldap_user_search_base, type: varchar(512) }
              - column: { name: ldap_user_search_filter, type: varchar(512) }
              - column: { name: ldap_bind_dn, type: varchar(512) }
              - column: { name: ldap_bind_password, type: varchar(512) }

        - createTable:
            tableName: build_records
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: username, type: varchar(128), constraints: { nullable: false } }
              - column: { name: scenario_name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: engine, type: varchar(16), constraints: { nullable: false } }
              - column: { name: filename, type: varchar(255), constraints: { nullable: false } }
              - column: { name: scenario_json, type: text, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }

        - createIndex:
            indexName: idx_build_records_username
            tableName: build_records
            columns:
              - column: { name: username }

        - createIndex:
            indexName: idx_build_records_created
            tableName: build_records
            columns:
              - column: { name: created_at }

        - createTable:
            tableName: projects
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }

        - createTable:
            tableName: scenarios
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: project_id, type: uuid, constraints: { nullable: false } }
              - column: { name: name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: version, type: int, constraints: { nullable: false } }
              - column: { name: data_json, type: text, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }

  - changeSet:
      id: 2-module3-gitlab-and-test-runs
      author: loadtest-portal
      comment: Module 3 — GitLab/Grafana settings + test_runs
      changes:
        - addColumn:
            tableName: portal_settings
            columns:
              - column: { name: gitlab_base_url, type: varchar(512), defaultValue: "" }
              - column: { name: gitlab_project_id, type: varchar(256), defaultValue: "" }
              - column: { name: gitlab_trigger_ref, type: varchar(256), defaultValue: "main" }
              - column: { name: gitlab_jmeter_variable, type: varchar(128), defaultValue: "LOADTEST_ENGINE=jmeter" }
              - column: { name: gitlab_k6_variable, type: varchar(128), defaultValue: "LOADTEST_ENGINE=k6" }
              - column: { name: gitlab_trigger_token_vault_path, type: varchar(512), defaultValue: "loadtest/gitlab/trigger-token" }
              - column: { name: gitlab_webhook_secret_vault_path, type: varchar(512), defaultValue: "loadtest/gitlab/webhook-secret" }
              - column: { name: grafana_base_url, type: varchar(512), defaultValue: "" }
              - column: { name: grafana_dashboard_template, type: varchar(2048), defaultValue: "" }

        - createTable:
            tableName: test_runs
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: username, type: varchar(128), constraints: { nullable: false } }
              - column: { name: scenario_name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: engine, type: varchar(16), constraints: { nullable: false } }
              - column: { name: build_id, type: uuid }
              - column: { name: target_url, type: varchar(2048), constraints: { nullable: false } }
              - column: { name: params_json, type: text }
              - column: { name: labels_json, type: text }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: gitlab_pipeline_id, type: bigint }
              - column: { name: gitlab_web_url, type: varchar(2048) }
              - column: { name: grafana_url, type: varchar(4096) }
              - column: { name: started_at, type: timestamptz }
              - column: { name: ended_at, type: timestamptz }
              - column: { name: error_message, type: varchar(2048) }
              - column: { name: events_json, type: text }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }

        - createIndex:
            indexName: idx_test_runs_username
            tableName: test_runs
            columns:
              - column: { name: username }

        - createIndex:
            indexName: idx_test_runs_created
            tableName: test_runs
            columns:
              - column: { name: created_at }

        - createIndex:
            indexName: idx_test_runs_pipeline
            tableName: test_runs
            columns:
              - column: { name: gitlab_pipeline_id }

  - changeSet:
      id: 3-scripts-and-run-ids
      author: loadtest-portal
      comment: script_id + test_id (Jira) + link build/script to runs
      changes:
        - createTable:
            tableName: scripts
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: username, type: varchar(128), constraints: { nullable: false } }
              - column: { name: build_id, type: uuid }
              - column: { name: engine, type: varchar(16), constraints: { nullable: false } }
              - column: { name: filename, type: varchar(255), constraints: { nullable: false } }
              - column: { name: source, type: varchar(32), constraints: { nullable: false } }
              - column: { name: git_url, type: varchar(2048) }
              - column: { name: content, type: bytea }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }

        - createIndex:
            indexName: idx_scripts_username
            tableName: scripts
            columns:
              - column: { name: username }

        - createIndex:
            indexName: idx_scripts_build
            tableName: scripts
            columns:
              - column: { name: build_id }

        - addColumn:
            tableName: test_runs
            columns:
              - column: { name: test_id, type: varchar(128), defaultValue: "" }
              - column: { name: script_id, type: uuid }

        - createIndex:
            indexName: idx_test_runs_test_id
            tableName: test_runs
            columns:
              - column: { name: test_id }

        - createIndex:
            indexName: idx_test_runs_script
            tableName: test_runs
            columns:
              - column: { name: script_id }

        - dropNotNullConstraint:
            tableName: test_runs
            columnName: target_url
            columnDataType: varchar(2048)

  - changeSet:
      id: 4-drop-unused-scenarios
      author: loadtest-portal
      comment: Remove unused scenarios table (scenario lives in build_records JSON)
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: scenarios
      changes:
        - dropTable:
            tableName: scenarios

  - changeSet:
      id: 5-drop-unused-projects
      author: loadtest-portal
      comment: Remove unused projects table (no entity/API references it)
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: projects
      changes:
        - dropTable:
            tableName: projects

  - changeSet:
      id: 6-gitlab-tokens-and-repository
      author: loadtest-portal
      comment: Store GitLab tokens/repo in settings (Vault later); ref fixed to master in code
      changes:
        - addColumn:
            tableName: portal_settings
            columns:
              - column: { name: gitlab_repository, type: varchar(256), defaultValue: "lt-ump" }
              - column: { name: gitlab_trigger_token, type: varchar(512), defaultValue: "" }
              - column: { name: gitlab_upload_token, type: varchar(512), defaultValue: "" }
              - column: { name: gitlab_webhook_secret, type: varchar(512), defaultValue: "" }

  - changeSet:
      id: 7-audit-events
      author: loadtest-portal
      comment: Admin audit trail — login, build save, script export, run start
      changes:
        - createTable:
            tableName: audit_events
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: username, type: varchar(128), constraints: { nullable: false } }
              - column: { name: action, type: varchar(32), constraints: { nullable: false } }
              - column: { name: detail, type: varchar(512), constraints: { nullable: false } }
        - createIndex:
            indexName: idx_audit_events_created
            tableName: audit_events
            columns:
              - column: { name: created_at }

  - changeSet:
      id: 8-auth-sessions-username
      author: loadtest-portal
      comment: Lookup/revoke sessions by username
      changes:
        - createIndex:
            indexName: idx_auth_sessions_username
            tableName: auth_sessions
            columns:
              - column: { name: username }

  - changeSet:
      id: 9-module4-analysis
      author: loadtest-portal
      comment: >
        Module 4 — target identity on runs + analysis reports.
        Отчёт хранится целиком в JSON: находки читаются документом, а не выборкой,
        а их структура будет меняться вместе с каталогом правил. Наружу вынесены
        только поля, по которым строится список и фильтры.
      changes:
        - addColumn:
            tableName: test_runs
            columns:
              - column: { name: target_cluster, type: varchar(128), defaultValue: "" }
              - column: { name: target_namespace, type: varchar(128), defaultValue: "" }
              - column: { name: target_service, type: varchar(191), defaultValue: "" }
              - column: { name: target_container, type: varchar(128), defaultValue: "" }

        - createTable:
            tableName: analysis_runs
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: username, type: varchar(128), constraints: { nullable: false } }
              - column: { name: test_run_id, type: uuid }
              - column: { name: test_id, type: varchar(128), defaultValue: "" }
              - column: { name: target_cluster, type: varchar(128), defaultValue: "" }
              - column: { name: target_namespace, type: varchar(128), defaultValue: "" }
              - column: { name: target_service, type: varchar(191), defaultValue: "" }
              - column: { name: target_container, type: varchar(128), defaultValue: "" }
              - column: { name: window_from, type: timestamptz, constraints: { nullable: false } }
              - column: { name: window_to, type: timestamptz, constraints: { nullable: false } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: verdict, type: varchar(16), defaultValue: "" }
              - column: { name: health_score, type: int, defaultValueNumeric: 0 }
              - column: { name: findings_count, type: int, defaultValueNumeric: 0 }
              - column: { name: headline, type: varchar(1024), defaultValue: "" }
              - column: { name: ruleset_version, type: varchar(32), defaultValue: "" }
              - column: { name: demo, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: report_json, type: text }
              - column: { name: error_message, type: varchar(2048), defaultValue: "" }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: finished_at, type: timestamptz }

        - createIndex:
            indexName: idx_analysis_runs_username
            tableName: analysis_runs
            columns:
              - column: { name: username }

        - createIndex:
            indexName: idx_analysis_runs_created
            tableName: analysis_runs
            columns:
              - column: { name: created_at }

        - createIndex:
            indexName: idx_analysis_runs_test_run
            tableName: analysis_runs
            columns:
              - column: { name: test_run_id }

  - changeSet:
      id: 10-analysis-rerun-inputs
      author: loadtest-portal
      comment: >
        Вход анализа рядом с его результатом. Пересчёт собирался из колонок записи, и всё,
        чего среди них нет, терялось: тип теста, пороги SLO, профиль демо-дефекта. Отчёты
        расходились на одном и том же прогоне, хотя сравнивать их — единственный смысл
        кнопки «Пересчитать». Дефект демо приходит из отчёта: в запросе он может быть
        пустым, и тогда синтетика выбирает его по хешу.
      changes:
        - addColumn:
            tableName: analysis_runs
            columns:
              - column: { name: demo_fault, type: varchar(32), defaultValue: "" }
              - column: { name: request_json, type: text }

  - changeSet:
      id: 11-run-verdict
      author: loadtest-portal
      comment: >
        Вердикт gate (passed/failed/invalid) отдельно от статуса пайплайна GitLab.
        Webhook видит только success/failed и не отличает нарушение SLA от невалидного прогона.
      changes:
        - addColumn:
            tableName: test_runs
            columns:
              - column: { name: verdict_status, type: varchar(16), defaultValue: "" }
              - column: { name: verdict_json, type: text }
