server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: constructor
  config:
    import: optional:file:${LOADTEST_CONSUL_VAULT_CONFIG:/config/consul-vault-config.yaml}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loadtest}
    username: ${SPRING_DATASOURCE_USERNAME:loadtest}
    password: ${SPRING_DATASOURCE_PASSWORD:loadtest}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    use-jackson2-defaults: true
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-enums: true

# Метрики для VictoriaMetrics.
# base-path=/ + path-mapping выводят экспозицию Prometheus ровно на /metrics
# (вместо стандартного /actuator/prometheus). Наружу открыт только этот эндпоинт:
# health/ready отдают собственные контроллеры, остальные actuator-эндпоинты закрыты.
management:
  endpoint:
    health:
      probes:
        enabled: false
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      # Общий тег на всех метриках — по нему метрики модулей различаются в VM.
      application: ${spring.application.name}
    distribution:
      # Гистограммы нужны, чтобы считать перцентили на стороне VM/Grafana,
      # а не хранить предрассчитанные значения от каждого инстанса.
      percentiles-histogram:
        http.server.requests: true
        portal.build.duration: true

# Defaults; в k8s перекрываются consul-vault-config.yaml и/или env.
analyzer:
  base-url: ${ANALYZER_BASE_URL:http://localhost:8000}

k6-generator:
  base-url: ${K6_GENERATOR_BASE_URL:http://localhost:8001}

jmeter-builder:
  base-url: ${JMETER_BUILDER_BASE_URL:http://localhost:8081}

gatling-generator:
  base-url: ${GATLING_GENERATOR_BASE_URL:http://localhost:8002}

loadtest:
  # Таймауты общего HTTP-клиента (см. config/HttpClientConfig).
  http:
    connect-timeout-ms: 5000
    # Генерация большого .jmx может занимать десятки секунд.
    read-timeout-ms: 60000
    # Пробы соседей в /ready: быстрый отказ вместо ожидания.
    probe-connect-timeout-ms: 2000
    probe-read-timeout-ms: 2000
  # Общий секрет constructor ↔ analyzer/генераторы. Пусто = не проверять (только локальный bootRun).
  internal-token: ${LOADTEST_INTERNAL_TOKEN:}
  cors:
    # Только Origin из адресной строки браузера. Не k8s Service, не «*».
    allowed-origins: ${LOADTEST_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  # Несекреты AD. Пусто = не перекрывать Consul и portal_settings.
  # Пароль bind — Vault loadtest/ad/bind-password или LDAP_BIND_PASSWORD.
  ad:
    enabled: ${LDAP_ENABLED:}
    url: ${LDAP_URL:}
    base-dn: ${LDAP_BASE_DN:}
    user-dn-pattern: ${LDAP_USER_DN_PATTERN:}
    user-search-base: ${LDAP_USER_SEARCH_BASE:}
    user-search-filter: ${LDAP_USER_SEARCH_FILTER:}
    bind-dn: ${LDAP_BIND_DN:}
  bootstrap:
    admin-username: ${LOADTEST_BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${LOADTEST_BOOTSTRAP_ADMIN_PASSWORD:}
  # Argo Job: --loadtest.db-init-exit=true --spring.main.web-application-type=none
  db-init-exit: false
  builds:
    # Sliding window при сохранении + фоновый TTL.
    retention-days: ${LOADTEST_BUILDS_RETENTION_DAYS:30}
    cleanup-enabled: ${LOADTEST_BUILDS_CLEANUP_ENABLED:true}
    # Каждый день в 03:15 UTC
    cleanup-cron: ${LOADTEST_BUILDS_CLEANUP_CRON:0 15 3 * * *}
