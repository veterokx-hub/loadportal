# Пример секретов для production (не коммитьте реальные значения)

apiVersion: v1
kind: Secret
metadata:
  name: loadtest-portal-db
  namespace: loadtest
type: Opaque
stringData:
  username: loadtest_app
  password: CHANGE_ME_STRONG_PASSWORD
  database: loadtest_portal
---
apiVersion: v1
kind: Secret
metadata:
  name: corp-registry-pull
  namespace: loadtest
type: kubernetes.io/dockerconfigjson
data:
  # kubectl create secret docker-registry corp-registry-pull \
  #   --docker-server=registry.corp.example \
  #   --docker-username=... --docker-password=... -o yaml
  .dockerconfigjson: e30=
