apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loadtest-portal.fullname" . }}-constructor
  labels:
    {{- include "loadtest-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: constructor
spec:
  replicas: {{ .Values.constructor.replicaCount }}
  selector:
    matchLabels:
      {{- include "loadtest-portal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: constructor
  template:
    metadata:
      labels:
        {{- include "loadtest-portal.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: constructor
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "loadtest-portal.serviceAccountName" . }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "loadtest-portal.dbHost" . }} {{ .Values.externalDatabase.port | default 5432 }}; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: constructor
          image: {{ include "loadtest-portal.image" (dict "Values" .Values "repo" .Values.constructor.image.repository "tag" .Values.constructor.image.tag) }}
          imagePullPolicy: {{ .Values.constructor.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.constructor.javaOpts | quote }}
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ include "loadtest-portal.dbHost" . }}:{{ .Values.externalDatabase.port | default 5432 }}/{{ .Values.externalDatabase.database | default "loadtest" }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "loadtest-portal.dbSecretName" . }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "loadtest-portal.dbSecretName" . }}
                  key: password
            - name: ANALYZER_BASE_URL
              value: http://{{ include "loadtest-portal.fullname" . }}-analyzer:8000
            - name: K6_GENERATOR_BASE_URL
              value: http://{{ include "loadtest-portal.fullname" . }}-k6-generator:8001
            - name: JMETER_BUILDER_BASE_URL
              value: http://{{ include "loadtest-portal.fullname" . }}-jmeter-builder:8081
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            {{- toYaml .Values.constructor.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
