# Значения по умолчанию для dev/staging в корпоративном k8s.
# Для production скопируйте values-production.example.yaml и адаптируйте.

nameOverride: ""
fullnameOverride: ""

global:
  imagePullSecrets: []
  # imageRegistry: registry.corp.example/loadtest

commonLabels:
  app.kubernetes.io/part-of: loadtest-platform
  app.kubernetes.io/component: script-preparation

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  host: loadtest.example.corp
  tls:
    enabled: true
    secretName: loadtest-portal-tls

frontend:
  replicaCount: 2
  image:
    repository: loadtest-portal/frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

constructor:
  replicaCount: 2
  image:
    repository: loadtest-portal/constructor
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  javaOpts: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport"
  # Сид admin при первом старте (смените в production!)
  bootstrapAdmin:
    username: admin
    password: "" # если пусто — используется "admin", задайте через existingSecret

analyzer:
  replicaCount: 2
  image:
    repository: loadtest-portal/analyzer
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  verifySsl: "false"
  caBundle: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

k6Generator:
  replicaCount: 2
  image:
    repository: loadtest-portal/k6-generator
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

jmeterBuilder:
  replicaCount: 2
  image:
    repository: loadtest-portal/jmeter-builder
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  javaOpts: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

postgresql:
  # В production рекомендуется managed PostgreSQL (externalDatabase.enabled: true)
  internal:
    enabled: true
    image: postgres:16-alpine
    storageClass: ""
    size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

externalDatabase:
  enabled: false
  host: postgres.loadtest.svc.cluster.local
  port: 5432
  database: loadtest
  username: loadtest
  existingSecret: loadtest-portal-db
  secretKeys:
    password: password

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
  interval: 30s
