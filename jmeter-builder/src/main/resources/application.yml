loadtest:
  internal-token: ${LOADTEST_INTERNAL_TOKEN:}

server:
  port: ${APP_PORT:8081}

spring:
  application:
    name: jmeter-builder
  jackson:
    use-jackson2-defaults: true
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-enums: true

# Метрики для VictoriaMetrics: экспозиция Prometheus выведена на /metrics,
# остальные actuator-эндпоинты закрыты (health отдаёт собственный контроллер).
management:
  endpoint:
    health:
      probes:
        enabled: false
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jmx.build.duration: true
