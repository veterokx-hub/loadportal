# =============================================================================
# consul-vault-config.yaml
# =============================================================================
# Единый конфиг адресов и discovery для Load Test Portal.
# В k8s монтируется как ConfigMap в pod constructor и orchestrator.
#
# Секреты (пароли БД, LDAP bind, bootstrap-admin, Vault token) — НЕ здесь.
# Секреты хранятся в Vault; в k8s подставляются через External Secrets / CSI / Argo.
#
# Приоритет URL модулей:
#   1) modules.*-url (если не пусто)
#   2) Consul KV/Catalog (если consul.enabled)
#   3) env / k8s Service DNS defaults
# =============================================================================

loadtest:
  # TTL истории сборок (constructor BuildRetentionJob). Перекрывает defaults application.yml.
  builds:
    retention-days: 30
    cleanup-enabled: true
    cleanup-cron: "0 15 3 * * *"

  discovery:
    # --- Адреса Consul и Vault (сами сервисы discovery/secrets) ---
    consul:
      enabled: false
      host: localhost          # в corp: consul.service.consul или ClusterIP
      port: 8500
      datacenter: ""
      kv-prefix: loadtest/
      # Имена сервисов в Consul Catalog (если enabled)
      service-frontend: loadtest-frontend
      service-constructor: loadtest-constructor
      service-analyzer: loadtest-analyzer
      service-k6: loadtest-k6-generator
      service-gatling: loadtest-gatling-generator
      service-jmeter: loadtest-jmeter-builder
      service-analysis: loadtest-analysis
      service-postgres: loadtest-postgres

    vault:
      enabled: false
      address: http://vault.corp.example:8200
      # Имя KV v2 mount. URL: {address}/v1/{kv-path}/data/{vault-path}
      # Токен чтения — env VAULT_TOKEN (или Vault Agent), не в этом файле.
      kv-path: secret

    # --- Все адреса модулей (включая frontend → backend) ---
    modules:
      # Frontend → constructor API.
      # Пустая строка = same-origin: браузер ходит на /api через Ingress (рекомендуется в k8s).
      # Локально (docker compose): http://localhost:8080
      frontend-api-base-url: ""

      # Внутренние URL (constructor → workers). В k8s — Service DNS.
      constructor-url: http://localhost:8080
      orchestrator-url: http://localhost:8082
      analyzer-url: http://localhost:8000
      k6-generator-url: http://localhost:8001
      gatling-generator-url: http://localhost:8002
      jmeter-builder-url: http://localhost:8081
      analysis-url: http://localhost:8003
      postgres-jdbc-url: jdbc:postgresql://localhost:5432/loadtest

  # CORS allowlist. В k8s обязательно заменить на Origin из браузера
  # (DevTools → любой /api → Request Headers → Origin). Не Service frontend, не «*».
  # Несколько URL — через запятую, без слэша в конце.
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000

  # Несекреты — Consul KV (prefix loadtest/), если discovery.consul.enabled=true.
  # Иначе env из application.yml, иначе БД portal_settings (GitLab/AD).
  # Ключи KV:
  #   s3/endpoint  s3/public-endpoint  s3/bucket  s3/region
  #   gitlab/base-url  gitlab/project-id  gitlab/repository  gitlab/ref
  #   ad/enabled  ad/url  ad/base-dn  ad/user-dn-pattern
  #   ad/user-search-base  ad/user-search-filter  ad/bind-dn
  #   victoriametrics/url  victoriametrics/concurrency  victoriametrics/timeout-sec
  #   analysis/demo  analysis/auto-on-finish
  # Секреты — Vault KV v2, поле data.value (или единственный ключ):
  #   loadtest/s3/access-key  loadtest/s3/secret-key
  #   loadtest/gitlab/trigger-token  loadtest/gitlab/webhook-secret  loadtest/gitlab/api-token
  #   loadtest/ad/bind-password
  #   loadtest/victoriametrics/bearer-token
  #   loadtest/internal-token

  # --- Модуль «Анализ» ---
  # Несекреты — Consul KV analysis/*, victoriametrics/*. Секреты — Vault.
  # Ниже только запасные значения, если Consul выключен.
  analysis:
    # Автозапуск отчёта после завершения прогона (orchestrator, по вебхуку GitLab).
    # Молча пропускается, если у прогона не заполнены cluster/namespace/service.
    # Consul KV analysis/auto-on-finish перекрывает это поле.
    auto-on-finish: true

