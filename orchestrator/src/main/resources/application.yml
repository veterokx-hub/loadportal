server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: orchestrator
  config:
    import: optional:file:${LOADTEST_CONSUL_VAULT_CONFIG:/config/consul-vault-config.yaml}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loadtest}
    username: ${SPRING_DATASOURCE_USERNAME:loadtest}
    password: ${SPRING_DATASOURCE_PASSWORD:loadtest}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  liquibase:
    enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    mapper:
      accept-case-insensitive-enums: true

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      application: ${spring.application.name}

loadtest:
  http:
    connect-timeout-ms: 5000
    read-timeout-ms: 60000
    probe-connect-timeout-ms: 2000
    probe-read-timeout-ms: 2000
